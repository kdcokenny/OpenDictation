name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      APP_PATH: build/Build/Products/Release/OpenDictation.app
      DMG_PATH: ${{ github.workspace }}/OpenDictation.dmg

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Validate release inputs
        id: release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi
          scripts/validate-version.sh "$version"
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is required for every published update" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point at a commit on the main branch" >&2
            exit 1
          fi

          version_without_build=${version%%+*}
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check Developer ID credentials
        id: developer-id
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          configured=0
          for value in \
            "$APPLE_APP_SPECIFIC_PASSWORD" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$DEVELOPER_ID_APPLICATION" \
            "$DEVELOPER_ID_CERTIFICATE_P12" \
            "$DEVELOPER_ID_CERTIFICATE_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ $configured -ne 0 && $configured -ne 6 ]]; then
            echo "Developer ID signing requires all six documented secrets" >&2
            exit 1
          fi

          if [[ $configured -eq 6 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Build and verify release app
        run: |
          make verify-release \
            RELEASE_VERSION='${{ steps.release.outputs.version }}' \
            BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            'XCODEBUILD_FLAGS=CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='

      - name: Sign app with Developer ID
        if: steps.developer-id.outputs.enabled == 'true'
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          codesign \
            --deep \
            --force \
            --options runtime \
            --timestamp \
            --entitlements OpenDictation/OpenDictation.entitlements \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          rm -f "$certificate_path"
          echo "keychain_path=$keychain_path" >> "$GITHUB_ENV"

      - name: Apply ad hoc signature
        if: steps.developer-id.outputs.enabled == 'false'
        run: |
          set -euo pipefail
          codesign \
            --deep \
            --force \
            --sign - \
            --entitlements OpenDictation/OpenDictation.entitlements \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          set -euo pipefail
          rm -f "$DMG_PATH"
          create-dmg \
            --volname 'Open Dictation' \
            --volicon 'OpenDictation/Resources/DMG/VolumeIcon.icns' \
            --background 'OpenDictation/Resources/DMG/background.tiff' \
            --window-pos 200 120 \
            --window-size 500 400 \
            --icon-size 70 \
            --icon 'OpenDictation.app' 100 200 \
            --hide-extension 'OpenDictation.app' \
            --app-drop-link 350 200 \
            "$DMG_PATH" \
            "$APP_PATH"
          test -s "$DMG_PATH"

      - name: Sign and notarize DMG
        id: distribution
        if: steps.developer-id.outputs.enabled == 'true'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail

          codesign --force --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          echo "status=Developer ID signed and notarized" >> "$GITHUB_OUTPUT"

      - name: Record ad hoc distribution status
        id: ad-hoc-distribution
        if: steps.developer-id.outputs.enabled == 'false'
        run: echo "status=Ad hoc signed and not notarized" >> "$GITHUB_OUTPUT"

      - name: Sign update with Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          sign_update="$(find build/SourcePackages/artifacts -type f -name sign_update -perm -111 -print -quit)"
          if [[ -z "$sign_update" ]]; then
            echo "Sparkle sign_update was not found in the resolved package artifacts" >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/sparkle-private-key"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_path"
          signature="$("$sign_update" -p --ed-key-file "$key_path" "$DMG_PATH")"
          if [[ -z "$signature" ]]; then
            echo "Sparkle did not return an EdDSA signature" >&2
            exit 1
          fi

          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z "$DMG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.DMG_PATH }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          body: |
            Distribution status: ${{ steps.distribution.outputs.status || steps.ad-hoc-distribution.outputs.status }}.

            The DMG has a valid Sparkle EdDSA signature. Builds marked as ad hoc signed are not notarized and will not pass normal Gatekeeper distribution checks.

      - name: Update appcast from local artifact metadata
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DMG_SIZE: ${{ steps.sparkle.outputs.size }}
          SPARKLE_SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          export PUB_DATE="$(date -R)"

          python3 <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET

          sparkle_namespace = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          ET.register_namespace("sparkle", sparkle_namespace)

          tree = ET.parse("appcast.xml")
          channel = tree.getroot().find("channel")
          if channel is None:
              raise SystemExit("appcast.xml has no channel element")

          version = os.environ["VERSION"]
          version_element = f"{{{sparkle_namespace}}}shortVersionString"
          for existing_item in channel.findall("item"):
              existing_version = existing_item.find(version_element)
              if existing_version is not None and existing_version.text == version:
                  channel.remove(existing_item)

          item = ET.SubElement(channel, "item")
          ET.SubElement(item, "title").text = f"Version {version}"
          ET.SubElement(item, "pubDate").text = os.environ["PUB_DATE"]
          ET.SubElement(item, f"{{{sparkle_namespace}}}version").text = os.environ["BUILD_NUMBER"]
          ET.SubElement(item, version_element).text = version
          ET.SubElement(item, f"{{{sparkle_namespace}}}minimumSystemVersion").text = "14.0"

          enclosure = ET.SubElement(item, "enclosure")
          enclosure.set(
              "url",
              f"https://github.com/kdcokenny/OpenDictation/releases/download/v{version}/OpenDictation.dmg",
          )
          enclosure.set(f"{{{sparkle_namespace}}}edSignature", os.environ["SPARKLE_SIGNATURE"])
          enclosure.set("length", os.environ["DMG_SIZE"])
          enclosure.set("type", "application/octet-stream")

          ET.indent(tree, space="  ")
          tree.write("appcast.xml", encoding="utf-8", xml_declaration=True)
          PYTHON

      - name: Commit appcast
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          git diff --cached --quiet && { echo "Appcast already contains this release"; exit 0; }
          git commit -m 'chore: update appcast for v${{ steps.release.outputs.version }}'
          git push origin HEAD:main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq .id)"
          if [[ -z "$release_id" ]]; then
            echo "Draft release was not found" >&2
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            --silent

      - name: Remove signing keychain
        if: always() && steps.developer-id.outputs.enabled == 'true'
        run: security delete-keychain "$keychain_path" || true
